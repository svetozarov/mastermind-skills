# deck-brief.yaml — пример конфигурации для mastermind-deck-tokens
# Передаётся в extract-style.py через --brief deck-brief.yaml
# Все поля опциональны. Указываются только те, что отличаются от дефолтов.

# --------------------------------------------------------------------------
# Управление шрифтами
# --------------------------------------------------------------------------

# font_fidelity: strict | editable
#
#   strict   — брендовый шрифт из референсов сохраняется точно.
#              Слайды с нераспознанным / не-web-safe шрифтом помечаются
#              для screenshot-режима (Playwright → PNG → addImage в PPTX).
#              Текст на таких слайдах НЕ редактируется в PowerPoint.
#
#   editable — применяется fallback-таблица (references/fallback-fonts.json).
#              Все слайды остаются редактируемыми в PowerPoint.
#              По умолчанию.
font_fidelity: editable

# --------------------------------------------------------------------------
# Референсы
# --------------------------------------------------------------------------

# references: список путей к файлам-референсам.
# Можно указать относительно рабочей директории или абсолютно.
# Поддерживаемые форматы: .png, .jpg, .jpeg, .pdf, .pptx
# Если references пустой — используется весь каталог --refs из CLI.
references:
  - references/slide-01-cover.png
  - references/slide-02-content.png
  - references/slide-03-section.png
  - references/brandbook.pdf

# Минимальное количество скриншотов для merge.
# Если меньше — пайплайн выдаёт предупреждение, но не останавливается.
min_screenshots: 3

# --------------------------------------------------------------------------
# Режим рендера
# --------------------------------------------------------------------------

# render_mode: html-first | screenshot-fallback
#
#   html-first        — основной режим: html2pptx + PptxGenJS.
#                       Слайды редактируемы в PowerPoint.
#                       Дефолт.
#
#   screenshot-fallback — все слайды рендерятся Playwright → PNG → addImage.
#                       Используется когда критична визуальная точность
#                       и редактируемость не важна.
render_mode: html-first

# --------------------------------------------------------------------------
# Vision API
# --------------------------------------------------------------------------

# vision_model: модель для Claude Vision (Шаг 4 пайплайна).
# Рекомендуется claude-sonnet-4-5 (баланс качества и стоимости).
# Альтернатива: claude-opus-4-7 (если refereces очень сложные).
vision_model: claude-sonnet-4-5

# vision_max_images: максимальное число изображений в одном Vision-запросе.
# При большом количестве референсов — увеличить не более 20 (лимит API).
vision_max_images: 5

# skip_vision: пропустить шаг Claude Vision (Шаг 4).
# Полезно для быстрого прогона без API-ключа или при оффлайн-работе.
skip_vision: false

# --------------------------------------------------------------------------
# Обязательные цвета (override)
# --------------------------------------------------------------------------

# color_overrides: явно задать цвета, которые НЕ нужно извлекать из референсов.
# Приоритет выше canonical (pdfplumber). Используется для строгого
# соблюдения брендбука.
# Формат: DTCG-совместимые hex.
color_overrides:
  # ink: "#0A0A0A"    # Раскомментировать если нужно зафиксировать ink
  # paper: "#F5F3EE"  # Раскомментировать если нужно зафиксировать paper
  # accent: "#D64518" # Раскомментировать если нужно зафиксировать accent

# --------------------------------------------------------------------------
# Сетка
# --------------------------------------------------------------------------

# grid_baseline: базовая единица сетки в пикселях (4 или 8).
# Все размеры и отступы в tokens.json будут кратны этому значению.
grid_baseline: 8

# --------------------------------------------------------------------------
# Метаданные
# --------------------------------------------------------------------------

# project_name: название проекта (используется в tokens.$metadata).
project_name: "Research Mastermind"

# slide_language: язык контента слайдов (влияет на hyphens и text-wrap).
slide_language: "ru"
